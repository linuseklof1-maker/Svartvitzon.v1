<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} | Svartvit zon</title>
  <meta name="description" content="{{ beskrivning }}">
  <link rel="stylesheet" href="/css/style.css">
  <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

  <div class="logo-banner">
    <a href="/">
      <img src="/bilder/logga.png" alt="Svartvit zon">
    </a>
  </div>

  <header class="site-header">
    <button class="meny-knapp" aria-expanded="false" aria-controls="huvudmeny" aria-label="Öppna meny">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav id="huvudmeny" class="huvudmeny">
      <a href="/">Svartvit zon</a>
      <a href="/merch/">Merch</a>
      <a href="/kontakt/">Kontakta oss</a>
      <a href="/arkiv/">Arkiv</a>
    </nav>
  </header>

  <main class="artikel">
    <article>
      <p class="artikel-kategori">{{ kategori }}</p>
      <h1>{{ rubrik }}</h1>
      <p class="artikel-datum"><time datetime="{{ datum }}">{{ datumtext }}</time></p>

      {% if bild %}
      <img src="{{ bild }}" alt="{{ bildalt }}" class="artikel-bild">
      {% endif %}

      <p class="ingress">{{ ingress }}</p>

      {{ content }}
    </article>

    <p class="tillbaka"><a href="/">← Tillbaka till flödet</a></p>
  </main>

  <footer class="site-footer">
    <p>Av supportrar, för supportrar</p>
    <p>Svartvit zon är en inofficiell supportersida och är inte ansluten till VPS.</p>
    <p><a href="/kontakt/">Kontakta oss</a></p>
  </footer>

  <script src="/js/meny.js"></script>

</body>
</html>
