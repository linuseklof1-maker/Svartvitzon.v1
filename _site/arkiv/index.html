<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arkiv – Svartvit zon</title>
  <meta name="description" content="Alla artiklar, spelarbetyg och quiz från Svartvit zon.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="logo-banner">
    <a href="/">
      <img src="/bilder/logga.png" alt="Svartvit zon">
    </a>
  </div>

  <header class="site-header">
    <button class="meny-knapp" aria-expanded="false" aria-controls="huvudmeny" aria-label="Öppna meny">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav id="huvudmeny" class="huvudmeny">
      <a href="/">Svartvit zon</a>
      <a href="/merch/">Merch</a>
      <a href="/kontakt/">Kontakta oss</a>
      <a href="/arkiv/" class="aktiv">Arkiv</a>
    </nav>
  </header>

  <main class="arkiv">
    <h1>Arkiv</h1>

    <div class="filter" id="filter">
      <button class="filter-knapp aktiv" data-typ="alla">Alla</button>
      <button class="filter-knapp" data-typ="artikel">Artiklar</button>
      <button class="filter-knapp" data-typ="video">Video</button>
      <button class="filter-knapp" data-typ="quiz">Quiz</button>
    </div>

    <ul class="arkiv-lista" id="arkiv-lista">
      <li class="laddar">Laddar arkivet...</li>
    </ul>
  </main>

  <footer class="site-footer">
    <p>Av supportrar, för supportrar</p>
    <p>Svartvit zon är en inofficiell supportersida och är inte ansluten till VPS.</p>
    <p><a href="/kontakt/">Kontakta oss</a></p>
  </footer>

  <script src="/js/meny.js"></script>
  <script src="/js/arkiv.js"></script>

</body>
</html>
